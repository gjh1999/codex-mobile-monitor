name: lanxi-coordinator
services:
  coordinator:
    extends:
      file: compose.coordinator.yaml
      service: coordinator

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      LANXI_DOMAIN: "${LANXI_DOMAIN:?设置 LANXI_DOMAIN 为协调服务域名}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  coordinator-data:
  caddy-data:
  caddy-config:
